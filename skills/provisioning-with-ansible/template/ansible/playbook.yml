# Starter playbook for a project's dev-environment provisioning.
#
# Copy this file to <project>/ansible/playbook.yml and edit the tasks below:
# delete the sections you don't need, rename/replace the example ones, keep
# the section comments so the next task lands in the right place.
#
# Run with: ansible-playbook ansible/playbook.yml --ask-become-pass
---
- name: Provision local dev environment
  hosts: localhost
  connection: local
  become: true
  tasks:
    # --- OS packages -------------------------------------------------------
    - name: Install graphviz (needed by the ERD export script)
      ansible.builtin.package:
        name: graphviz
        state: present

    # --- Add a repo/PPA first, when the package needs one ------------------
    - name: Add the deadsnakes PPA (needed for python3.12 on older Ubuntu)
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
      when: ansible_facts['distribution'] == 'Ubuntu'

    - name: Install python3.12
      ansible.builtin.package:
        name: python3.12
        state: present

    # --- Pinned binary download ---------------------------------------------
    - name: Download shellcheck 0.10.0
      ansible.builtin.get_url:
        url: https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
        dest: /tmp/shellcheck.tar.xz
        checksum: sha256:6c88f0648237d5d000f6572640b6a7b0402238ffd58b3323490c6e78f7d3d51
      register: shellcheck_download

    - name: Install shellcheck to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/shellcheck.tar.xz
        dest: /usr/local/bin
        extra_opts: ["--strip-components=1", "shellcheck-v0.10.0/shellcheck"]
        remote_src: true
        mode: "0755"
      when: shellcheck_download.changed

    # --- Node/npm global tool ------------------------------------------------
    - name: Install the markdownlint CLI globally
      community.general.npm:
        name: markdownlint-cli
        global: true
        state: present

    # --- One-off command (always guard with creates: or when:) -------------
    - name: Run the project's one-time DB seed script
      ansible.builtin.command:
        cmd: ./scripts/seed-db.sh
        chdir: "{{ playbook_dir }}/.."
        creates: "{{ playbook_dir }}/../.seeded"

    # --- Python-backed tooling (venv via uv) --------------------------------
    # uv is the one Python package manager to use here: no pip install,
    # python -m venv, poetry, or conda. See the setup-python-venv skill for
    # one exception to the paths below: inside the Claude Code sandbox, the
    # venv must live at ~/.venvs/<project> instead of in-project, because the
    # /c/... mount rejects symlink creation that `uv sync` needs.
    - name: Install pipx
      ansible.builtin.package:
        name: pipx
        state: present

    - name: Install uv via pipx
      community.general.pipx:
        name: uv
        state: present

    - name: Sync the project's Python venv (creates .venv/, reads pyproject.toml)
      ansible.builtin.command:
        cmd: uv sync
        chdir: "{{ playbook_dir }}/.."
        creates: "{{ playbook_dir }}/../.venv/bin/python"

    - name: Run a Python script from that venv
      ansible.builtin.command:
        cmd: uv run scripts/check_env.py
        chdir: "{{ playbook_dir }}/.."
      changed_when: false
